[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderflow"
version = "0.1.0"
description = "Production-style modular monolith ordering backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "redis>=5.2,<6", "celery[redis]>=5.4,<6",
  "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "structlog>=24.4,<26", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<7", "ruff>=0.8,<1", "mypy>=1.14,<2", "testcontainers[postgres,redis]>=4.9,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/app", "mock_payment_provider"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis", "concurrency: real PostgreSQL locking test"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
